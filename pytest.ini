# Pytest configuration for local development and Jenkins CI pipelines.
# Generates JUnit XML reports that Jenkins can parse and display in the UI.

[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --junitxml=test-results/junit-report.xml
    --cov=calculator
    --cov-report=term-missing
    --cov-report=xml:test-results/coverage.xml
    --cov-report=html:test-results/coverage-html

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
